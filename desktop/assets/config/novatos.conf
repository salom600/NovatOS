## NovatOS Desktop configuration file

[General]
# Desktop background color (used if wallpaper is missing)
BackgroundColor=#0F1117

# Accent color (used for highlights, buttons, etc.)
AccentColor=#4CC2FF

# Text color
TextColor=#FFFFFF

[Taskbar]
# Taskbar position: bottom, top, left, right
Position=bottom

# Taskbar height in pixels
Height=48

# Taskbar opacity (0.0 - 1.0)
Opacity=0.92

[StartMenu]
# Start menu width
Width=500

# Start menu height
Height=500

[Wallpaper]
# Default wallpaper path
Path=/usr/share/novatos/wallpapers/aurora.png

# Wallpaper mode: fill, stretch, center, tile
Mode=fill

[Fonts]
# Default font family
Family=Noto Sans

# Default font size
Size=13
