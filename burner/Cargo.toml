[package]
name = "novatos-burner"
version = "2026.1.0"
edition = "2021"
description = "NovatOS USB Burner — flash ISO to USB drives (DD mode)"
authors = ["NovatOS Project"]

[[bin]]
name = "NovatOSBurner"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_DeviceIO",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
