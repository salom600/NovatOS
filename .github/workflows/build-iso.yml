name: Build NovatOS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  build:
    name: Build ISO (Debian 12 live-build)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools
          # Install Debian keyring (Ubuntu runner doesn't have it by default)
          sudo apt-get install -y debian-archive-keyring
          # Download Debian debootstrap config (Ubuntu's debootstrap may not know "bookworm")
          sudo mkdir -p /usr/share/debootstrap/scripts
          if [ ! -f /usr/share/debootstrap/scripts/bookworm ]; then
            sudo ln -sf /usr/share/debootstrap/scripts/sid /usr/share/debootstrap/scripts/bookworm 2>/dev/null || true
            # If sid doesn't exist either, download from Debian
            if [ ! -f /usr/share/debootstrap/scripts/bookworm ]; then
              sudo wget -q -O /usr/share/debootstrap/scripts/bookworm https://salsa.debian.org/installer-team/debootstrap/-/raw/master/scripts/bookworm || true
            fi
          fi

      - name: Copy NovatOS desktop source
        run: |
          # Copy the desktop source into the chroot so it gets compiled during build
          mkdir -p build/includes.chroot/usr/src/novatos-desktop
          cp -r desktop/* build/includes.chroot/usr/src/novatos-desktop/

          # Copy the installer
          mkdir -p build/includes.chroot/usr/local/bin
          cp installer/src/novatos_installer.py build/includes.chroot/usr/local/bin/novatos-installer
          chmod +x build/includes.chroot/usr/local/bin/novatos-installer

          # Copy the desktop launcher script
          chmod +x build/includes.chroot/usr/local/bin/novatos-desktop

      - name: Build ISO
        id: build
        run: |
          cd build
          # Configure live-build (Debian 12 Bookworm)
          # All mirrors must point to Debian (not Ubuntu) — the runner is Ubuntu
          # but we're building Debian, so debootstrap needs Debian repos.
          lb config \
            --distribution bookworm \
            --architecture amd64 \
            --archive-areas "main contrib non-free-firmware non-free" \
            --binary-images iso-hybrid \
            --chroot-filesystem squashfs \
            --compression xz \
            --debian-installer none \
            --interactive false \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://security.debian.org/debian-security/" \
            --mirror-binary-security "http://security.debian.org/debian-security/" \
            --bootappend-live "boot=live components nomodeset quiet splash"

          echo "::group::live-build output"
          sudo lb build 2>&1 | tee build.log
          echo "::endgroup::"

          # Find produced ISO
          ISO_FILE=$(ls -1 *.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            echo "::error::No ISO produced"
            ls -la
            echo "=== Last 80 lines of build log ==="
            tail -80 build.log
            exit 1
          fi

          ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
          SHA256=$(sha256sum "$ISO_FILE" | cut -d' ' -f1)
          echo "iso_path=$(pwd)/$ISO_FILE" >> "$GITHUB_OUTPUT"
          echo "iso_basename=$ISO_FILE" >> "$GITHUB_OUTPUT"
          echo "iso_version=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_OUTPUT"
          echo "iso_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$SHA256  $ISO_FILE" > "${ISO_FILE}.sha256sum"

      - name: Upload ISO artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: novatos-iso-${{ steps.build.outputs.iso_version }}
          path: |
            build/*.iso
            build/*.sha256sum
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: build/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Split ISO for release
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: split
        run: |
          cd build
          ISO_FILE=$(ls -1 *.iso | head -1)
          ISO_BASENAME=$(basename "$ISO_FILE" .iso)
          split -b 1900M -d -a 2 "$ISO_FILE" "${ISO_BASENAME}.iso.part"
          echo "chunk_count=$(ls -1 ${ISO_BASENAME}.iso.part* | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.iso_version }}-${{ github.run_number }}
          name: NovatOS ${{ steps.build.outputs.iso_version }} (Build #${{ github.run_number }})
          body: |
            # NovatOS Aurora (Debian 12) — ${{ steps.build.outputs.iso_version }}

            **Build #${{ github.run_number }}** · commit `${{ github.sha }}`

            ## What's New
            - **Debian 12 (Bookworm) base** — rock-solid stable foundation
            - **Custom NovatOS Desktop** — built with Qt6, ~150-200MB RAM
            - **Modern graphical installer** — Windows 11-style, easy to use
            - **GPU fallback** — works on any GPU (AMD R2, NVIDIA GT 240M, modern, VMs)
            - **Windows .exe USB burner** included (NovatOSBurner.exe)
            - **2 boot modes:** Live (test) + Install (permanent)

            ## Download
            - **ISO:** ${{ steps.split.outputs.chunk_count }} chunks (~1.9GB each)
            - **Burner:** NovatOSBurner.exe (53 KB)
            Reassemble: `cat novatos-*.iso.part* > novatos.iso`

            ## Boot Menu
            1. **NovatOS Live** — boot to desktop (no install)
            2. **NovatOS Install** — graphical installer

            ## Login
            - **Username:** novatos
            - **Password:** (empty — just press Enter)
          files: |
            build/*.iso.part*
            build/*.sha256sum
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
