name: Validate Profile

# Runs on every push & PR — fast lint of the archiso profile before the heavy ISO build.
# Catches syntax errors, missing files, duplicate packages, etc., in seconds.

on:
  push:
    branches: [main, master]
    paths:
      - 'archiso/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate archiso profile
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          pacman -Syu --noconfirm --needed bash shellcheck

      - name: Validate profiledef.sh
        run: |
          bash -n archiso/novatos/profiledef.sh
          shellcheck archiso/novatos/profiledef.sh || true

      - name: Validate customize_airootfs.sh
        run: |
          bash -n archiso/novatos/airootfs/root/customize_airootfs.sh
          shellcheck archiso/novatos/airootfs/root/customize_airootfs.sh || true

      - name: Validate user scripts
        run: |
          for f in archiso/novatos/airootfs/usr/local/bin/*; do
              [ -f "$f" ] || continue
              echo "==> $f"
              bash -n "$f"
              shellcheck "$f" || true
          done

      - name: Check for duplicate packages
        run: |
          cd archiso/novatos
          # Strip comments and blank lines, then look for dups
          dups=$(grep -vE '^#|^$' packages.x86_64 | sort | uniq -d)
          if [ -n "$dups" ]; then
              echo "::error::Duplicate packages found:"
              echo "$dups"
              exit 1
          fi
          echo "OK — no duplicate packages"

      - name: Check pacman.conf is valid
        run: |
          if [ ! -f archiso/novatos/pacman.conf ]; then
              echo "::error::pacman.conf missing"
              exit 1
          fi
          # quick sanity checks
          grep -q '\[core\]'     archiso/novatos/pacman.conf
          grep -q '\[extra\]'    archiso/novatos/pacman.conf
          grep -q '\[multilib\]' archiso/novatos/pacman.conf
          echo "pacman.conf OK"

      - name: Check profiledef is valid
        run: |
          # shellcheck disable=SC1090
          source archiso/novatos/profiledef.sh
          for var in iso_name iso_label iso_version iso_install_dir arch pacman_conf airootfs_dir; do
              if [ -z "${!var:-}" ]; then
                  echo "::error::profiledef.sh: $var is not set"
                  exit 1
              fi
              echo "  $var = ${!var}"
          done
          echo "profiledef.sh OK"

      - name: Check Calamares config
        run: |
          if [ ! -f archiso/novatos/airootfs/etc/calamares/settings.conf ]; then
              echo "::error::Calamares settings.conf missing"
              exit 1
          fi
          echo "Calamares settings.conf present"

      - name: Check branding files
        run: |
          for f in logo.png icon.png welcome.png; do
              if [ ! -f "archiso/novatos/airootfs/usr/share/calamares/branding/novatos/$f" ]; then
                  echo "::error::Missing branding file: $f"
                  exit 1
              fi
          done
          echo "Branding files OK"

      - name: Summary
        run: |
          echo "### Validation summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packages: $(grep -cv '^#\|^$' archiso/novatos/packages.x86_64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branding assets: $(find archiso/novatos/airootfs/usr/share -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
          echo "- Calamares modules: $(find archiso/novatos/airootfs/etc/calamares/modules -name '*.conf' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
