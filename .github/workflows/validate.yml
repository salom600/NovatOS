name: Validate Profile

# Runs on every push & PR — fast lint of the archiso profile before the heavy ISO build.
# Catches syntax errors, missing files, duplicate packages, etc., in seconds.

on:
  push:
    branches: [main, master]
    paths:
      - 'archiso/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Validate archiso profile
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          pacman -Syu --noconfirm --needed bash shellcheck python3 jq

      - name: Validate profiledef.sh
        run: |
          bash -n archiso/novatos/profiledef.sh
          shellcheck archiso/novatos/profiledef.sh || true

      - name: Validate customize_airootfs.sh
        run: |
          bash -n archiso/novatos/airootfs/root/customize_airootfs.sh
          shellcheck archiso/novatos/airootfs/root/customize_airootfs.sh || true

      - name: Validate user scripts
        run: |
          for f in archiso/novatos/airootfs/usr/local/bin/*; do
              [ -f "$f" ] || continue
              echo "==> $f"
              bash -n "$f"
              shellcheck "$f" || true
          done

      - name: Check for duplicate packages
        run: |
          cd archiso/novatos
          # Strip comments and blank lines, then look for dups
          dups=$(grep -vE '^#|^$' packages.x86_64 | sort | uniq -d)
          if [ -n "$dups" ]; then
              echo "::error::Duplicate packages found:"
              echo "$dups"
              exit 1
          fi
          echo "OK — no duplicate packages"

      - name: Check pacman.conf is valid
        run: |
          if [ ! -f archiso/novatos/pacman.conf ]; then
              echo "::error::pacman.conf missing"
              exit 1
          fi
          # quick sanity checks
          grep -q '\[core\]'     archiso/novatos/pacman.conf
          grep -q '\[extra\]'    archiso/novatos/pacman.conf
          grep -q '\[multilib\]' archiso/novatos/pacman.conf
          echo "pacman.conf OK"

      - name: Check profiledef is valid
        run: |
          # shellcheck disable=SC1090
          source archiso/novatos/profiledef.sh
          # NOTE: archiso 89+ uses `install_dir` (not `iso_install_dir`)
          for var in iso_name iso_label iso_version install_dir arch pacman_conf airootfs_dir; do
              if [ -z "${!var:-}" ]; then
                  echo "::error::profiledef.sh: $var is not set"
                  exit 1
              fi
              echo "  $var = ${!var}"
          done
          # Also warn if the old variable name is used
          if [ -n "${iso_install_dir:-}" ]; then
              echo "::error::profiledef.sh: uses deprecated 'iso_install_dir' — rename to 'install_dir' (archiso 89+)"
              exit 1
          fi
          echo "profiledef.sh OK"

      - name: Check archiso.conf drop-in exists
        run: |
          if [ ! -f archiso/novatos/airootfs/etc/mkinitcpio.conf.d/archiso.conf ]; then
              echo "::error::Missing /etc/mkinitcpio.conf.d/archiso.conf — initramfs won't have the archiso live-boot hook!"
              exit 1
          fi
          # Verify it contains the archiso hook
          if ! grep -q 'archiso' archiso/novatos/airootfs/etc/mkinitcpio.conf.d/archiso.conf; then
              echo "::error::archiso.conf drop-in doesn't contain the 'archiso' hook"
              exit 1
          fi
          echo "archiso.conf drop-in OK"

      - name: Check mkinitcpio-archiso in package list
        run: |
          if ! grep -q '^mkinitcpio-archiso$' archiso/novatos/packages.x86_64; then
              echo "::error::mkinitcpio-archiso not in packages.x86_64 — live-boot hooks won't be available!"
              exit 1
          fi
          echo "mkinitcpio-archiso found in package list"

      - name: Check boot configs (UEFI + BIOS)
        run: |
          # UEFI: loader.conf + entries
          if [ ! -f archiso/novatos/efiboot/loader/loader.conf ]; then
              echo "::error::Missing efiboot/loader/loader.conf"
              exit 1
          fi
          if ! ls archiso/novatos/efiboot/loader/entries/*.conf >/dev/null 2>&1; then
              echo "::error::No UEFI boot entries in efiboot/loader/entries/"
              exit 1
          fi
          # Check for the bug that caused "Error preparing initrd: Not found":
          # UEFI entries must NOT reference separate intel-ucode.img / amd-ucode.img
          # because the `microcode` hook bundles microcode INTO the main initramfs.
          if grep -rE 'intel-ucode\.img|amd-ucode\.img' archiso/novatos/efiboot/loader/entries/; then
              echo "::error::UEFI entries reference separate ucode .img files — these don't exist on the ESP (microcode is bundled in initramfs). Remove the intel-ucode.img / amd-ucode.img initrd lines."
              exit 1
          fi
          # UEFI entries must use %ARCH% placeholder (not hardcoded x86_64)
          if grep -rE '/x86_64/' archiso/novatos/efiboot/loader/entries/; then
              echo "::error::UEFI entries use hardcoded /x86_64/ — should use /%ARCH%/ placeholder"
              exit 1
          fi
          # BIOS: syslinux configs
          for f in syslinux.cfg archiso_head.cfg archiso_sys.cfg archiso_sys-linux.cfg archiso_tail.cfg; do
              if [ ! -f "archiso/novatos/syslinux/$f" ]; then
                  echo "::error::Missing syslinux config: $f"
                  exit 1
              fi
          done
          # Same ucode check for syslinux
          if grep -rE 'intel-ucode\.img|amd-ucode\.img' archiso/novatos/syslinux/; then
              echo "::error::Syslinux configs reference separate ucode .img files — these don't exist (microcode is bundled in initramfs)."
              exit 1
          fi
          # splash.png must exist (archiso copies it to /boot/syslinux/)
          if [ ! -f archiso/novatos/syslinux/splash.png ]; then
              echo "::warning::splash.png missing — syslinux will have no background image"
          fi
          echo "Boot configs OK"

      - name: Check archinstall config (replaces Calamares)
        run: |
          if [ ! -f archiso/novatos/airootfs/etc/novatos/archinstall-user-configuration.json ]; then
              echo "::error::archinstall config missing"
              exit 1
          fi
          # Validate it parses as JSON
          python3 -c "import json; json.load(open('archiso/novatos/airootfs/etc/novatos/archinstall-user-configuration.json'))" || {
              echo "::error::archinstall config is not valid JSON"
              exit 1
          }
          echo "archinstall config OK"

      - name: Check branding files
        run: |
          for f in logo.png icon.png welcome.png; do
              if [ ! -f "archiso/novatos/airootfs/usr/share/calamares/branding/novatos/$f" ]; then
                  echo "::error::Missing branding file: $f"
                  exit 1
              fi
          done
          echo "Branding files OK"

      - name: Summary
        run: |
          echo "### Validation summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packages: $(grep -cv '^#\|^$' archiso/novatos/packages.x86_64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branding assets: $(find archiso/novatos/airootfs/usr/share -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
          echo "- Calamares modules: $(find archiso/novatos/airootfs/etc/calamares/modules -name '*.conf' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
