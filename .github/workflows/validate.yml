name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Checking required files..."
          for f in \
            build/config/package-lists/novatos-core.list.chroot \
            build/config/hooks/normal/01-novatos-customize.hook.chroot \
            build/includes.chroot/usr/local/bin/novatos-desktop \
            build/includes.chroot/usr/local/bin/novatos-menu \
            build/includes.chroot/usr/local/bin/novatos-lock \
            build/includes.chroot/etc/skel/.config/tint2/tint2rc \
            build/includes.chroot/etc/skel/.config/openbox/rc.xml \
            build/includes.chroot/etc/skel/.config/nitrogen/bg-saved.cfg \
            build/includes.chroot/etc/skel/Desktop/install-novatos.desktop \
            installer/src/novatos_installer.py \
            burner/src/main.c \
            .github/workflows/build-iso.yml \
            .github/workflows/build-burner.yml \
            .github/workflows/validate.yml
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate Python syntax (installer)
        run: |
          python3 -c "import ast; ast.parse(open('installer/src/novatos_installer.py').read())" || {
            echo "::error::Installer Python syntax error"
            exit 1
          }
          echo "Installer Python syntax OK"

      - name: Check C brace balance (burner)
        run: |
          OPENS=$(grep -o '{' burner/src/main.c | wc -l)
          CLOSES=$(grep -o '}' burner/src/main.c | wc -l)
          if [ "$OPENS" != "$CLOSES" ]; then
            echo "::error::Burner C braces unbalanced ($OPENS open, $CLOSES close)"
            exit 1
          fi
          echo "Burner C braces balanced ($OPENS pairs)"

      - name: Check C++ brace balance (desktop, if exists)
        run: |
          if [ -d desktop/src ]; then
            for f in desktop/src/*.cpp desktop/src/*.h 2>/dev/null; do
              [ -f "$f" ] || continue
              OPENS=$(grep -o '{' "$f" | wc -l)
              CLOSES=$(grep -o '}' "$f" | wc -l)
              if [ "$OPENS" != "$CLOSES" ]; then
                echo "::error::$f braces unbalanced ($OPENS open, $CLOSES close)"
                exit 1
              fi
            done
            echo "Desktop C++ braces balanced"
          else
            echo "Desktop source not present (using openbox — OK)"
          fi

      - name: Check shell scripts
        run: |
          for f in build/includes.chroot/usr/local/bin/novatos-*; do
            [ -f "$f" ] || continue
            bash -n "$f" || {
              echo "::error::$f shell syntax error"
              exit 1
            }
          done
          echo "Shell scripts OK"

      - name: Validate workflow YAMLs
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || {
              echo "::error::$f invalid YAML"
              exit 1
            }
          done
          echo "Workflow YAMLs OK"

      - name: Summary
        run: |
          echo "### Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All checks passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package list: $(grep -cv '^#\|^$' build/config/package-lists/novatos-core.list.chroot) packages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desktop source: $(find desktop/src -name '*.cpp' -o -name '*.h' | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
          echo "- Burner source: $(wc -l < burner/src/main.c) lines" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installer source: $(wc -l < installer/src/novatos_installer.py) lines" >> "$GITHUB_STEP_SUMMARY"
