name: Build NovatOS Burner (.exe)

on:
  push:
    branches: [main]
    paths:
      - 'burner/**'
      - '.github/workflows/build-burner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-burner:
    name: Build Windows .exe USB burner
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: cmd
        run: |
          pip install pyinstaller pillow --upgrade

      - name: Generate icon
        shell: pwsh
        run: |
          if (-not (Test-Path burner\novatos.ico)) {
            python -c "from PIL import Image; img = Image.new('RGBA', (256, 256), (15, 17, 23, 255)); img.save('burner/novatos.ico')"
          }

      - name: Build .exe
        shell: cmd
        working-directory: burner
        run: |
          pyinstaller --onefile --windowed --name NovatOSBurner --icon=novatos.ico --noconfirm --clean src\main.py

      - name: Verify .exe
        shell: pwsh
        run: |
          if (Test-Path burner\dist\NovatOSBurner.exe) {
            $size = (Get-Item burner\dist\NovatOSBurner.exe).Length / 1MB
            Write-Host "NovatOSBurner.exe built successfully ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "NovatOSBurner.exe not found!"
            exit 1
          }

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovatOSBurner-exe
          path: burner/dist/NovatOSBurner.exe
          retention-days: 30

      - name: Publish .exe to latest release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest release and upload the .exe to it
          $release = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets | ConvertFrom-Json
          if ($release) {
            Write-Host "Uploading NovatOSBurner.exe to release: $($release.tagName)"
            gh release upload $release.tagName burner/dist/NovatOSBurner.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            Write-Host "No existing release found — creating a new one for the burner"
            gh release create "burner-${{ github.run_number }}" burner/dist/NovatOSBurner.exe --repo $env:GITHUB_REPOSITORY --title "NovatOS Burner (Build ${{ github.run_number }})" --notes "Windows USB burner .exe"
          }
