name: Build NovatOS Burner (.exe)

on:
  push:
    branches: [main]
    paths:
      - 'burner/**'
      - '.github/workflows/build-burner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-burner:
    name: Build Rust Windows .exe USB burner
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            burner/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('burner/Cargo.lock', 'burner/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release .exe
        shell: pwsh
        working-directory: burner
        run: |
          cargo build --release
          if (Test-Path target\release\NovatOSBurner.exe) {
            $size = [math]::Round((Get-Item target\release\NovatOSBurner.exe).Length / 1MB, 2)
            Write-Host "NovatOSBurner.exe built successfully ($size MB)"
          } else {
            Write-Error "NovatOSBurner.exe not found!"
            exit 1
          }

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovatOSBurner-exe
          path: burner/target/release/NovatOSBurner.exe
          retention-days: 30

      - name: Publish .exe to latest release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait up to 5 minutes for the ISO build to create a release
          $retries = 30
          $release = $null
          while ($retries -gt 0) {
            try {
              $release = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,uploadUrl 2>$null | ConvertFrom-Json
              if ($release -and $release.tagName) {
                break
              }
            } catch {}
            Write-Host "Waiting for ISO release to be created... ($retries retries left)"
            Start-Sleep -Seconds 10
            $retries--
          }

          if ($release) {
            Write-Host "Uploading NovatOSBurner.exe to release: $($release.tagName)"
            gh release upload $release.tagName burner/target/release/NovatOSBurner.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            Write-Host "No existing release found — creating a new one for the burner"
            gh release create "burner-${{ github.run_number }}" burner/target/release/NovatOSBurner.exe --repo $env:GITHUB_REPOSITORY --title "NovatOS Burner (Build ${{ github.run_number }})" --notes "Windows USB burner .exe (Rust)"
          }
