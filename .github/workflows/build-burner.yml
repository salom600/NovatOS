name: Build NovatOS Burner (.exe)

on:
  push:
    branches: [main]
    paths:
      - 'burner/**'
      - '.github/workflows/build-burner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-burner:
    name: Build C Windows .exe USB burner
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 + GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build .exe with GCC
        shell: msys2 {0}
        working-directory: burner
        run: |
          gcc -o NovatOSBurner.exe src/main.c \
            -lgdi32 -lcomctl32 -lcomdlg32 -luser32 -lkernel32 \
            -mwindows -O2 -s -static -static-libgcc
          if [ -f NovatOSBurner.exe ]; then
            ls -la NovatOSBurner.exe
            echo "Build OK"
          else
            echo "Build FAILED"
            exit 1
          fi

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovatOSBurner-exe
          path: burner/NovatOSBurner.exe
          retention-days: 30

      - name: Publish .exe to latest release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $retries = 60
          $release = $null
          while ($retries -gt 0) {
            try {
              $release = gh release view --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | ConvertFrom-Json
              if ($release -and $release.tagName) { break }
            } catch {}
            Write-Host "Waiting for ISO release... ($retries retries left)"
            Start-Sleep -Seconds 10
            $retries--
          }
          if ($release) {
            Write-Host "Uploading NovatOSBurner.exe to release: $($release.tagName)"
            gh release upload $release.tagName burner/NovatOSBurner.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create "burner-${{ github.run_number }}" burner/NovatOSBurner.exe --repo $env:GITHUB_REPOSITORY --title "NovatOS Burner (Build ${{ github.run_number }})" --notes "Windows USB burner .exe"
          }
