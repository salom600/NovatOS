## NovatOS live-build configuration
## Based on Debian 12 (Bookworm) — stable foundation for all hardware

# ─── Image architecture & type ───
LB_ARCHITECTURE="amd64"
LB_DISTRIBUTION="bookworm"
LB_ARCHIVE_AREAS="main contrib non-free-firmware non-free"

# ─── Image type: hybrid ISO (works as CD + USB) ───
LB_BINARY_IMAGES="iso-hybrid"
LB_BINARY_FILESYSTEM="squashfs"
LB_COMPRESSION="xz"

# ─── Bootloader: BIOS + UEFI hybrid ───
LB_BINARY_LOADERS="grub-pc grub-efi"
LB_BOOTLOADERS="grub-pc,grub-efi-amd64"
LB_UEFI_SECURE_BOOT="enable"

# ─── Mirror (Debian official) ───
LB_MIRROR_BOOTSTRAP="http://deb.debian.org/debian/"
LB_MIRROR_BINARY="http://deb.debian.org/debian/"
LB_MIRROR_CHROOT="http://deb.debian.org/debian/"

# ─── Chroot filesystem options ───
LB_CHROOT_FILESYSTEM="squashfs"

# ─── Packages: install during chroot build ───
# (package lists are in config/package-lists/)
LB_PACKAGES=""

# ─── Custom packages: install from local .deb files ───
LB_CUSTOM_PACKAGES=""

# ─── Mirror bootstrap options ───
LB_DEBIAN_INSTALLER="none"
LB_DEBIAN_INSTALLER_DISTRIBUTION="${LB_DISTRIBUTION}"

# ─── Security + volatile mirrors ───
LB_MIRROR_CHROOT_SECURITY="http://security.debian.org/debian-security/"
LB_MIRROR_BINARY_SECURITY="http://security.debian.org/debian-security/"

# ─── Timezone + locale ───
LB_TIMEZONE="UTC"
LB_LANGUAGE="en"
LB_LOCALES="en_US.UTF-8"

# ─── Keyboard ───
LB_KEYMAPS="us"

# ─── Bootstrap flavors ───
LB_BOOTSTRAP_FLAVOUR="minimal"

# ─── Hostname ───
LB_HOSTNAME="novatos"

# ─── Username + password (live user) ───
LB_USERNAME="novatos"
LB_USER_PASSWORD="novatos"
LB_USER_FULLNAME="NovatOS Live User"

# ─── Root password ───
LB_ROOT_PASSWORD="novatos"

# ─── Source images ───
LB_SOURCE="false"

# ─── Win32-loader ───
LB_WIN32_LOADER="false"

# ─── ISO volume name ───
LB_ISO_VOLUME="NOVATOS_$(date +%Y%m)"

# ─── Sysem-wide config ───
LB_SYMLINUX_BOOT_ENTRIES="live install"
LB_GRUB_BOOT_ENTRIES="live install"

# ─── Hooks ───
LB_HOOKS=""

# ─── Interactive shell ───
LB_INTERACTIVE="false"
