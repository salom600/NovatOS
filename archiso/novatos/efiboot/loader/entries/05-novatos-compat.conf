# NovatOS Live (Compatibility mode) — for 2009-era and older hardware
# Uses LTS kernel + nomodeset + no KMS for maximum compatibility
title    NovatOS Live (Compatibility, old hardware)
sort-key 05
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 nomodeset 3
