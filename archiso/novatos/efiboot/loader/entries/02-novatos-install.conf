# NovatOS Install Mode — boot directly to installer (archinstall)
# Boots to a console TTY that auto-launches the NovatOS installer.
# If internet is available, downloads latest drivers; if not, installs basic drivers.

title    NovatOS Install
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 systemd.unit=multi-user.target novatos.install=1
