# NovatOS UEFI boot entries (systemd-boot)
# Placeholders %INSTALL_DIR% and %ARCHISO_LABEL% are filled by archiso at build time.

timeout 8
default novatos-zen
console-mode max

# --- NovatOS default (zen kernel, best desktop latency) ---
title   NovatOS Live (zen kernel)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3

# --- NovatOS LTS kernel (fallback) ---
title   NovatOS Live (LTS kernel)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3

# --- NovatOS NVIDIA mode (blacklist nouveau for systems with NVIDIA dGPUs) ---
title   NovatOS Live (NVIDIA proprietary)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/intel-ucode.img
initrd  /%INSTALL_DIR%/boot/amd-ucode.img
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 modprobe.blacklist=nouveau nvidia.NVreg_DynamicPowerManagement=0x20
