# NovatOS UEFI boot entries (systemd-boot)
# Placeholders substituted by archiso at build time:
#   %INSTALL_DIR%  → install_dir from profiledef.sh (e.g. "novatos")
#   %ARCH%         → arch from profiledef.sh (e.g. "x86_64")
#   %ARCHISO_UUID% → UUID of the ISO filesystem
#
# IMPORTANT: Do NOT reference separate intel-ucode.img / amd-ucode.img files.
# The `microcode` hook in /etc/mkinitcpio.conf.d/archiso.conf bundles microcode
# INTO the main initramfs, so separate ucode files don't exist on the ESP.
# Referencing them causes "Error preparing initrd: Not found" in systemd-boot.
#
# We use archisosearchuuid (not archisolabel) because label-based mounting
# can fail on some UEFI firmware (e.g. VMware's UEFI implementation).

# --- NovatOS default (zen kernel, best desktop latency) ---
title    NovatOS Live (zen kernel, recommended)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

# --- NovatOS LTS kernel (fallback) ---
title    NovatOS Live (LTS kernel, fallback)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

# --- NovatOS NVIDIA mode (blacklist nouveau for systems with NVIDIA dGPUs) ---
title    NovatOS Live (NVIDIA, blacklist nouveau)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 modprobe.blacklist=nouveau

# --- NovatOS Safe graphics mode (nomodeset, for display issues) ---
title    NovatOS Live (Safe graphics, nomodeset)
sort-key 04
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nomodeset
