# NovatOS Live — boot to Hyprland desktop (for testing)
# Works on ANY GPU: AMD, Intel, NVIDIA, old + new
# Kernel params disable KMS by default for maximum compatibility.
# Hyprland will run in software rendering mode (llvmpipe) if GPU driver fails.

title    NovatOS Live
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nomodeset
