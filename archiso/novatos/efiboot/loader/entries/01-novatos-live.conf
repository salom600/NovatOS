# NovatOS Live Mode — boot to Hyprland desktop (for testing)
# Works on any hardware: tries GPU acceleration, falls back to software rendering.
# Placeholders: %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID% (substituted by archiso)

title    NovatOS Live
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3
