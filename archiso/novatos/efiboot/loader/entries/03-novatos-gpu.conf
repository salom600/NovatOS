# NovatOS Live (GPU Accelerated) — for modern GPUs that support KMS
# Use this if the default "NovatOS Live" works but you want GPU acceleration.
# Enables amdgpu/radeon/i915/nouveau drivers.

title    NovatOS Live (GPU Accelerated)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3
