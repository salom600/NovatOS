# archiso.cfg — Main syslinux menu config (loaded by syslinux.cfg)
# =================================================================
# This file is loaded via the CONFIG directive in syslinux.cfg.
# It contains the UI directive (vesamenu), menu settings, and boot entries.
#
# %INSTALL_DIR% and %ARCHISO_LABEL% are substituted by archiso at build time.

UI /%INSTALL_DIR%/boot/syslinux/vesamenu.c32
MENU TITLE NovatOS Linux (Aurora 2026)
MENU BACKGROUND /%INSTALL_DIR%/boot/syslinux/novatos.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 8
MENU VSHIFT 10
MENU TIMEOUTROW 16
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 18
MENU HELPMSGENDROW 24

MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #f0ffffff #20ffffff std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR hotsel       1;7;37;40 #e0400000 #20ff0000 all
MENU COLOR hotkey       1;37;44 #ffffffff #a0000000 std
MENU COLOR tabmsg       1;37;40 #cfcccccc #20000000 std
MENU COLOR timeout      1;37;40 #cfcc8800 #20000000 std
MENU COLOR timeout_msg  37;40   #c0c0c0c0 #20000000 std

# --- Default boot entry (zen kernel — best desktop latency) ---
LABEL novatos-zen
    MENU LABEL NovatOS Live (zen kernel, recommended)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

# --- LTS kernel fallback ---
LABEL novatos-lts
    MENU LABEL NovatOS Live (LTS kernel, fallback)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

# --- NVIDIA mode (blacklist nouveau) ---
LABEL novatos-nvidia
    MENU LABEL NovatOS Live (NVIDIA proprietary, blacklist nouveau)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% modprobe.blacklist=nouveau

# --- Safe graphics mode (nomodeset, for display issues) ---
LABEL novatos-safe
    MENU LABEL NovatOS Live (Safe graphics, nomodeset)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset 3

ONTIMEOUT novatos-zen
