# archiso_sys-linux.cfg — BIOS boot entries (local disk/ISO boot)
# Placeholders substituted by archiso at build time:
#   %INSTALL_DIR%  → install_dir from profiledef.sh (e.g. "novatos")
#   %ARCH%         → arch from profiledef.sh (e.g. "x86_64")
#   %ARCHISO_UUID% → UUID of the ISO filesystem
#
# IMPORTANT: Do NOT reference separate intel-ucode.img / amd-ucode.img files.
# The `microcode` hook bundles microcode INTO the main initramfs.

# --- NovatOS default (zen kernel) ---
LABEL novatos-zen
TEXT HELP
Boot NovatOS Live (zen kernel) — recommended for desktop use.
Tuned for lower desktop latency and gaming.
ENDTEXT
MENU LABEL NovatOS Live (zen kernel, ^recommended)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

# --- NovatOS LTS kernel (fallback) ---
LABEL novatos-lts
TEXT HELP
Boot NovatOS Live (LTS kernel) — use if zen kernel has issues.
ENDTEXT
MENU LABEL NovatOS Live (^LTS kernel, fallback)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

# --- NovatOS NVIDIA mode (blacklist nouveau) ---
LABEL novatos-nvidia
TEXT HELP
Boot NovatOS Live with nouveau blacklisted.
Use this for systems with NVIDIA dGPUs.
ENDTEXT
MENU LABEL NovatOS Live (NVIDIA, blacklist ^nouveau)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 modprobe.blacklist=nouveau

# --- NovatOS Safe graphics mode (nomodeset) ---
LABEL novatos-safe
TEXT HELP
Boot NovatOS Live with nomodeset (no KMS).
Use this if you get a black screen or display corruption.
ENDTEXT
MENU LABEL NovatOS Live (^Safe graphics, nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nomodeset
