# archiso_sys-linux.cfg — BIOS boot entries
# Placeholders: %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID%
#
# All entries use 'nomodeset' for UNIVERSAL GPU compatibility.
# This ensures NovatOS boots on ANY hardware: AMD R2, NVIDIA GT 240M, Intel, etc.
# Hyprland runs in software rendering (llvmpipe) if GPU driver fails.

# --- NovatOS Live (universal — works on any GPU) ---
LABEL novatos-live
TEXT HELP
Boot NovatOS Live — works on ANY computer (2009-2026).
Uses software rendering for maximum compatibility.
ENDTEXT
MENU LABEL NovatOS ^Live
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nomodeset

# --- NovatOS Install (graphical installer) ---
LABEL novatos-install
TEXT HELP
Install NovatOS permanently to your hard drive.
Launches a modern graphical installer.
ENDTEXT
MENU LABEL NovatOS ^Install
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 nomodeset systemd.unit=graphical.target novatos.install=1

# --- NovatOS Live (GPU Accelerated — for modern GPUs) ---
LABEL novatos-gpu
TEXT HELP
Boot NovatOS Live with GPU acceleration (amdgpu, i915, nouveau).
Use this if 'NovatOS Live' works but you want better performance.
ENDTEXT
MENU LABEL NovatOS Live (GPU ^Accelerated)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3
