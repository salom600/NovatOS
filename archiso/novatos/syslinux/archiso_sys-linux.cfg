# archiso_sys-linux.cfg — BIOS boot entries (exactly 2 options)
# Placeholders: %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID%

# --- NovatOS Live Mode ---
LABEL novatos-live
TEXT HELP
Boot NovatOS Live — test the system from USB.
Works on any hardware (2009-2026) with automatic GPU fallback.
ENDTEXT
MENU LABEL NovatOS ^Live
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3

# --- NovatOS Install Mode ---
LABEL novatos-install
TEXT HELP
Install NovatOS permanently to your hard drive.
Downloads latest drivers if internet is available.
ENDTEXT
MENU LABEL NovatOS ^Install
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 systemd.unit=multi-user.target novatos.install=1
