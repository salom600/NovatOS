# archiso_pxe-linux.cfg — PXE boot entries (NBD/NFS/HTTP)
# Used when booting from network via PXE. Most users won't need these,
# but they're included for completeness (matches official releng).

LABEL novatos-nbd
TEXT HELP
Boot NovatOS Live using NBD (Network Block Device).
ENDTEXT
MENU LABEL NovatOS Live (zen kernel, ^NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL novatos-nfs
TEXT HELP
Boot NovatOS Live using NFS.
ENDTEXT
MENU LABEL NovatOS Live (zen kernel, NF^S)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y
SYSAPPEND 3

LABEL novatos-http
TEXT HELP
Boot NovatOS Live using HTTP.
ENDTEXT
MENU LABEL NovatOS Live (zen kernel, ^HTTP)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=http://${pxeserver}/ cms_verify=y
SYSAPPEND 3
