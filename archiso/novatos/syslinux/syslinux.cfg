# syslinux.cfg — BIOS El Torito boot entry point
# ===============================================
# Uses whichsys.c32 to dispatch between PXE/sys/iso modes (same as official releng).
# This is the FIRST config file syslinux reads when booting from BIOS.

DEFAULT select

LABEL select
COM32 whichsys.c32
APPEND -pxe- pxe -sys- sys -iso- sys

LABEL pxe
CONFIG archiso_pxe.cfg

LABEL sys
CONFIG archiso_sys.cfg
