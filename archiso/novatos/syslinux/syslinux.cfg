# syslinux.cfg — BIOS El Torito boot entry point
# ===============================================
# This is the FIRST config file syslinux reads when booting from BIOS.
# It must be MINIMAL — just redirect to the real config in the install_dir.
#
# The `CONFIG` directive loads a new config file, and `APPEND` sets the
# working directory so relative paths in the new config resolve correctly.
#
# %INSTALL_DIR% and %ARCHISO_LABEL% are substituted by archiso at build time.

DEFAULT loadconfig

LABEL loadconfig
  CONFIG /%INSTALL_DIR%/boot/syslinux/archiso.cfg
  APPEND /%INSTALL_DIR%/
