# Calamares unpackfs module — copy live filesystem to target
---
# Source: the live squashfs
source:
    - /run/novatos/bootmnt/novatos/x86_64/airootfs.sfs
    - /run/novatos/bootmnt/novatos/x86_64/airootfs.img

# Destination: target root mounted at /tmp/calamares-root-XXXXX (handled by mount module)
unpack:
    -   source: /run/novatos/bootmnt/novatos/x86_64/airootfs.sfs
        sourcefs: squashfs
        destination: ""

# Weight for progress reporting
weight: 1
