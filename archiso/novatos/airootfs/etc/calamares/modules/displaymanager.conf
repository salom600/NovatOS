# Calamares displaymanager module — enable SDDM autologin on installed system
---
displaymanagers:
    - sddm

# Autologin (user selects during install; safe default here)
autologin:
    user: ""
    vacuum: true

# Set up the basic SDDM theme
defaultDesktopEnvironment:
    executable: "startplasma-x11"
    desktopFile: "plasma"

# Whether to do basic setup of the DM
basicSetup: false

# Don't reset to nothing; preserve what the user picked
sysconfigSetup: false
