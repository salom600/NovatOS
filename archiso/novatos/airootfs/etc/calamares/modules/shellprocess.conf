# Calamares shellprocess module — run after packages are installed
---
# Run NovatOS-specific post-install hooks
dontChroot: false

script:
    - "touch @@ROOT@@/etc/novatos-installed"
    - "@@ROOT@@/usr/bin/systemctl set-default graphical.target"
    - "@@ROOT@@/usr/bin/systemctl enable sddm.service NetworkManager.service bluetooth.service cups.service"
    - "@@ROOT@@/usr/bin/systemctl enable --now firewalld.service 2>/dev/null || true"
    - "@@ROOT@@/usr/bin/flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true"
