# mkinitcpio drop-in config for NovatOS live ISO
# ================================================
# In archiso 89+, initramfs hooks are configured via drop-in files in
# /etc/mkinitcpio.conf.d/, NOT in /etc/mkinitcpio.conf directly.
#
# This file is the CRITICAL piece that makes the ISO bootable.
# Without the `archiso` hook, the initramfs drops to emergency shell with
# "device '' not found" because it doesn't know how to mount the live squashfs.
#
# Hook order:
#   base udev microcode modconf kms  — early boot
#   memdisk                          — support for booting from ISO images
#   archiso                          — THE live-boot magic hook
#   archiso_loop_mnt                 — loop-mount the squashfs
#   archiso_pxe_common               — PXE boot support
#   archiso_pxe_nbd                  — NBD boot support
#   archiso_pxe_http                 — HTTP boot support
#   archiso_pxe_nfs                  — NFS boot support
#   block filesystems keyboard       — mount real filesystems
#
# Compression: xz at -9e for smallest ISO size (slower decompress but much smaller)

HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)

COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
