# Calamares packages module — install/remove on target system
---
# Use pacman backend (Arch)
backend: pacman

# Operations to run on the target system
operations:
  - install:
      # Ensure these are present on the installed system too
      - base
      - base-devel
      - linux
      - linux-zen
      - linux-firmware
      - grub
      - efibootmgr
      - networkmanager
      - plasma
      - sddm
      - dolphin
      - konsole
      - kate
      - firefox
      - git
      - paru
  - try_remove:
      # Live-only packages that don't belong on the installed system
      - archiso
      - calamares
      - calamares-core
