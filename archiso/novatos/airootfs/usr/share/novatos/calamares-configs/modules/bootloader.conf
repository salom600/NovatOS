# Calamares bootloader module — install GRUB
---
# EFI bootloader: grub
efiBootLoader: "grub"

# GRUB install location (BIOS). "default" lets Calamares pick the right disk.
kernel: "/boot/vmlinuz-linux-zen"

# GRUB config to write
keepDistributor: true

# Where to install GRUB (auto = use the disk of the / partition)
installBootLoader: true

# Don't override the existing GRUB theme
keepMokManager: false

# Look for other OSes via os-prober
probe: true

# Set a custom GRUB menu entry prefix
distributor: "NovatOS"
