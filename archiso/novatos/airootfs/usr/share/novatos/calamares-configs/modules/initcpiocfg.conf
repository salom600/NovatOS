# Calamares initcpiocfg module
---
# Use the same mkinitcpio.conf the live system uses
presetName: linux
key: MODULES
val: vmd nvme ahci sd_mod usb_storage uas btrfs ext4 vfat exfat overlay

# Hooks for installed system (no archiso hooks)
hooks:
  - base
  - udev
  - modconf
  - kms
  - keyboard
  - keymap
  - consolefont
  - block
  - filesystems
  - fsck

# Compression
compression: zstd
compressionOptions: ["-T0", "-19"]
