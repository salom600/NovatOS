# Calamares users module
---
# Default user/group setup. The user fills these in interactively.
userShell: /bin/zsh

# Default hostname the user will see (editable)
hostname: novatos

# Allow the user to set their own password
doAutologin: false

# Set root password? If false, root account is locked and sudo is used.
setRootPassword: false

# Don't allow weak passwords
allowWeakPasswords: false
doPasswordChecks: true

# Require passwords to match
doReusePassword: true

# Default avatar (used if no avatar is set)
avatarFilePath: /usr/share/calamares/branding/novatos/avatar.png

# Sudoers group
sudoersGroup: wheel

# Only lowercase, digits, dashes, underscores allowed
userNamePattern: '^[a-z_][a-z0-9_-]*$'

# Default groups to add the new user to
defaultGroups:
    - wheel
    - storage
    - optical
    - network
    - video
    - audio
    - input
    - lp
    - sys
    - power
    - users
