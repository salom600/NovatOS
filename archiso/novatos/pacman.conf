#
# /etc/pacman.conf for NovatOS archiso build
#
# Official Arch repos only — AUR helpers installed post-install via novatos-first-run.
# Parallel downloads enabled for faster CI builds.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
NoProgressBar

# Core / Extra / Multilib
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
