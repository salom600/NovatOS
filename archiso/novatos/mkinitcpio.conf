# mkinitcpio.conf — base config for NovatOS
# ==========================================
# In archiso 89+, the actual HOOKS are set in the drop-in file:
#   airootfs/etc/mkinitcpio.conf.d/archiso.conf
#
# This file provides MODULES and other settings. The drop-in's HOOKS
# completely override any HOOKS set here (mkinitcpio merges drop-ins
# in a last-wins fashion for HOOKS).

MODULES=(vmd nvme ahci sd_mod usb_storage uas btrfs ext4 vfat exfat overlay)

BINARIES=()

FILES=()

# HOOKS here are overridden by the archiso.conf drop-in.
# Left empty intentionally — the drop-in provides the full hook list.
HOOKS=()

COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
