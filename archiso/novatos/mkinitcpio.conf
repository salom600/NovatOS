# mkinitcpio.conf for NovatOS archiso profile
# ============================================
# This file is copied to /etc/mkinitcpio.conf in the airootfs by archiso.
# It configures the initramfs for the LIVE ISO boot.
#
# CRITICAL: The `archiso` hook MUST be in HOOKS — without it, the initramfs
# doesn't know how to mount the live squashfs and drops to emergency shell
# with "device '' not found".
#
# Hook order matters:
#   base udev modconf kms  — early boot
#   archiso                — live boot magic (finds ISO, mounts squashfs)
#   block filesystems fsck — mount real filesystems
#   keyboard keymap consolefont — console setup (after root is mounted)

MODULES=(vmd nvme ahci sd_mod usb_storage uas btrfs ext4 vfat exfat overlay)

BINARIES=()

FILES=()

HOOKS=(base udev modconf kms archiso block filesystems fsck keyboard keymap consolefont)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
